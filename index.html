<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MacroGlobe 3D — santé macroéconomique, dépendances structurelles et projections à 10 et 25 ans de plus de 200 économies." />
    <meta name="theme-color" content="#05070b" />
    <title>MacroGlobe 3D</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%2305070b' stroke='%23f5a623' stroke-width='2'/><path d='M2 16h28M16 2c5 4 5 24 0 28M16 2c-5 4-5 24 0 28' stroke='%23f5a623' stroke-width='1.5' fill='none'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts load without blocking the first paint (system fonts until they arrive) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" /></noscript>
    <link rel="preload" as="fetch" href="./data/macro_data.json" crossorigin />
    <style>
      /* static splash, painted before any JavaScript; React replaces it on mount */
      html, body, #root { height: 100%; margin: 0; background: radial-gradient(ellipse at 50% 40%, #0b1424 0%, #05070b 70%); }
      .boot { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
              font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #898781; font-size: 12px; text-align: center; }
      .boot b { font-family: ui-monospace, Consolas, monospace; letter-spacing: .2em; color: #f0efec; font-size: 14px; }
      .boot b span { color: #f5a623; }
      .boot svg .o { transform-origin: 44px 44px; animation: boot-spin 2.4s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot svg .o { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <svg width="88" height="88" viewBox="0 0 88 88" aria-hidden="true">
          <circle cx="44" cy="44" r="30" fill="#0d1c33" stroke="rgba(57,135,229,.5)" />
          <g class="o"><ellipse cx="44" cy="44" rx="42" ry="14" fill="none" stroke="rgba(245,166,35,.6)" stroke-dasharray="4 6" /><circle cx="86" cy="44" r="3" fill="#f5a623" /></g>
        </svg>
        <div><b>MACROGLOBE<span> 3D</span></b><br />Chargement des données macroéconomiques mondiales…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
