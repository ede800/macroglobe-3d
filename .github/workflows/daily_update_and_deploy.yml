name: Daily data update & deploy

on:
  schedule:
    - cron: '0 2 * * *' # every day at 02:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed macro_data.json
  pages: write # deploy to GitHub Pages
  id-token: write # required by actions/deploy-pages

concurrency:
  group: macroglobe-pages
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r scripts/requirements.txt

      - name: Refresh macro data (World Bank + news sentiment)
        # The script falls back to cached/seed data on any network error, so it
        # always writes a valid file. If it crashes outright, keep yesterday's file.
        run: python scripts/update_macro_data.py || echo "::warning::Pipeline failed, keeping the previous macro_data.json"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/macro_data.json public/data/macro_details.json
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "data: daily macro update $(date -u +'%Y-%m-%d') [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build (Vite, base './')
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: update-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
